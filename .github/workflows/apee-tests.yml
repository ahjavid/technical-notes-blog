name: APEE tests

# Unit tests for the APEE package in posts/apee-evaluation-ecosystem.
# Tests that need a running Ollama server are skipped automatically.
on:
  push:
    branches: [main]
    paths:
      - "posts/apee-evaluation-ecosystem/**"
      - ".github/workflows/apee-tests.yml"
  pull_request:
    paths:
      - "posts/apee-evaluation-ecosystem/**"
      - ".github/workflows/apee-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: posts/apee-evaluation-ecosystem
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q
